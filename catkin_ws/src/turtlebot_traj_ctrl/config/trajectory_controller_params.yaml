# Trajectory controller configuration parameters
  /trajectory_controller/run_period: 0.01           # Node execution period

  /trajectory_controller/Kp_x: 1.6           # Proportional gain in x direction
  /trajectory_controller/Kp_y: 1.6            # Proportional gain in y direction
  /trajectory_controller/Tx: 2.1           # Integral time constant in x direction (Ki = Kp/Tx = 3)
  /trajectory_controller/Ty: 2.1           # Integral time constant in y direction (Ki = Kp/Ty = 3)
  /trajectory_controller/Ts: 0.01            # Sampling time

  /trajectory_controller/eps: 0.2            # Epsilon distance from the trajectory
  /trajectory_controller/v_feedforward: 1.5  # Feedforward velocity
  /trajectory_controller/w_feedforward: 1.5  # Feedforward angular velocity
  /trajectory_controller/a: 6.0           # Trajectory generator amplitude (1 meter)
  /trajectory_controller/T: 6.5          # Trajectory generator total time (20 seconds)