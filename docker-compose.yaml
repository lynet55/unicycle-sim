
services:
  ros-noetic:
    image: osrf/ros:noetic-desktop-full
    container_name: ros-noetic-workspace
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
    volumes:
      # Mount your project directory
      - ./catkin_ws:/workspace
      # Share X11 socket for GUI applications
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Persist bash history
      - ./docker-data/bash_history:/root/.bash_history
      # Mount requirements.txt for plotting dependencies
      - ./requirements.txt:/tmp/requirements.txt
      # Mount plotting script
      - ./plot_rosbag.py:/workspace/plot_rosbag.py
    working_dir: /workspace
    command: bash -c "apt-get update && apt-get install -y python3-pip python3-matplotlib python3-numpy python3-rosbag && pip3 install -r /tmp/requirements.txt && echo 'source /opt/ros/noetic/setup.bash' >> /root/.bashrc && echo 'source /workspace/devel/setup.bash 2>/dev/null || true' >> /root/.bashrc && source /opt/ros/noetic/setup.bash && bash"